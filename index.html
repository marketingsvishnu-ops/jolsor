<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Cricket Score</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f4f7;
      color: #222;
    }

    header {
      background: #075e2f;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .live {
      display: inline-block;
      background: #e53935;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-top: 8px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .score-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .match {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    .team {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5px;
      border-bottom: 1px solid #eee;
    }

    .team-name {
      font-size: 20px;
      font-weight: bold;
    }

    .score {
      font-size: 25px;
      font-weight: bold;
      color: #075e2f;
    }

    .overs {
      color: #777;
      font-size: 14px;
    }

    .status {
      text-align: center;
      margin: 20px 0;
      font-weight: bold;
      color: #075e2f;
    }

    .players {
      margin-top: 20px;
    }

    .players h3 {
      margin-bottom: 10px;
    }

    .player {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      background: #f7f7f7;
      margin-bottom: 5px;
      border-radius: 7px;
    }

    .refresh {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #075e2f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .refresh:hover {
      background: #064b26;
    }

    footer {
      text-align: center;
      color: #777;
      margin-top: 25px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🏏 Live Cricket</h1>
    <span class="live">● LIVE</span>
  </header>

  <div class="container">

    <div class="score-card">

      <div class="match">
        International Cricket Match
      </div>

      <div class="team">
        <div>
          <div class="team-name">India 🇮🇳</div>
          <div class="overs">Overs: 18.4</div>
        </div>

        <div class="score">
          165/4
        </div>
      </div>

      <div class="team">
        <div>
          <div class="team-name">Australia 🇦🇺</div>
          <div class="overs">Target: 201</div>
        </div>

        <div class="score">
          200/6
        </div>
      </div>

      <div class="status">
        India need 36 runs from 8 balls
      </div>

      <div class="players">
        <h3>🏏 Batting</h3>

        <div class="player">
          <span>Virat Kohli *</span>
          <strong>72 (41)</strong>
        </div>

        <div class="player">
          <span>Hardik Pandya</span>
          <strong>31 (18)</strong>
        </div>
      </div>

      <div class="players">
        <h3>⚾ Bowling</h3>

        <div class="player">
          <span>Pat Cummins</span>
          <strong>3.4 - 32 - 2</strong>
        </div>
      </div>

      <button class="refresh" onclick="updateScore()">
        🔄 Refresh Score
      </button>

    </div>

    <footer>
      Cricket Live Score © 2026
    </footer>

  </div>

  <script>
    function updateScore() {
      alert("Score refreshed!");
    }
  </script>

</body>
</html>
